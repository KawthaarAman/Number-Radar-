<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Radar</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./app.js"></script>
</head>

<body>

    <button id="theme-toggle">Dark Mode</button>

    <div class="container">

        <h1>Number Radar </h1>

        <p id="high-score">High Score: 0</p>
        <p id="current-score"></p>

        <!-- Choose the mode for the game -->

        <div id="mode-selection">
            <p>Choose your game mode</p>

            <button>Player vs Computer</button>
            <button>Player vs Player</button>
        </div>

        <!-- Game area -->

        <div id="game-area" class="hidden">

            <h3 id="game-title">Number Radar</h3>

            <!-- Player 1 area -->

            <div id="p1-input-area" class="hidden">
                <p>Player 1: Enter Secret Number (1-100)</p>

                <input type="password" id="secret-number" placeholder="Secret Number">

                <br>

                <button>Lock Number</button>
            </div>

            <!-- Guessing area -->

            <div id="guess-area" class="hidden">
                <p id="turn-instruction">
                    Guess the number (between 1 and 100):
                </p>

                <input type="number" id="user-guess" min="1" max="100" placeholder="Your Guess">

                <br>

                <button>Check Guess</button>
            </div>

            <!-- Message -->

            <p class="message" id="game-message"></p>

            <button id="restart-btn">Restart Game</button>

            <button id="pause-btn">Pause</button>

            <button id="resume-btn" class="hidden">Resume</button>

        </div>

    </div>

</body>

</html>
